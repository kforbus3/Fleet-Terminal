# golangci-lint configuration for the Fleet Terminal backend.
#
# An enterprise-reasonable baseline: correctness linters that catch real bugs,
# plus gosec for a security-focused platform. Style-only nits are left off so
# the gate stays about defects rather than taste. Run locally with:
#
#   cd backend && golangci-lint run
#
# CI runs this non-blocking initially (continue-on-error) — see .github/workflows/ci.yml.

run:
  timeout: 10m
  tests: true

linters:
  # Start from a curated set rather than defaults so the list is explicit.
  disable-all: true
  enable:
    - govet        # suspicious constructs the compiler allows
    - staticcheck  # the staticcheck SA/ST/QF checks (also our standalone job)
    - errcheck     # unchecked errors — important for a PAM/audit codebase
    - ineffassign  # assignments never read
    - unused       # unused code
    - gosec        # security issues (crypto, injection, file perms, etc.)

linters-settings:
  gosec:
    excludes:
      # G104 overlaps errcheck; let errcheck own unchecked-error reporting.
      - G104
  staticcheck:
    checks:
      - all

issues:
  # Don't cap findings — a truncated report hides work.
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files legitimately ignore errors and use weak randomness for fixtures.
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    # Generated code should not be linted for style/security we don't control.
    - path: (^|/)(mocks?|generated|.*\.gen)\.go
      linters:
        - gosec
        - staticcheck
        - unused
